name: Attested XMesh Sub release
on:
  push:
    branches: [main]

# Trusted publisher: not triggered by pull_request or workflow_dispatch.
# GITHUB_TOKEN has no repository write access. It only uploads OIDC attestations
# after deterministic tests pass. No long-lived private release keys exist.
permissions:
  contents: read

concurrency:
  group: sub-attest-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'TriplexCorp/XMesh-Sub' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Lint and integration tests
        run: |
          bash -n install.sh bootstrap.sh tests/test-install.sh tests/test-bootstrap.sh
          shellcheck -s bash install.sh bootstrap.sh tests/test-install.sh tests/test-bootstrap.sh
          bash tests/test-install.sh
          bash tests/test-bootstrap.sh
          python3 -m py_compile manager.py release_verify.py limiter.py
          python3 tests/test-manager.py
          python3 tests/test-limiter.py
          python3 tests/test-release-verify.py
          python3 tests/test-workflow-security.py
      - name: Validate the actual generated gateway
        run: |
          bash install.sh --panel https://panel.example.org --domain sub.example.org --path /s --dry-run |
            sed -n '/^# Caddyfile$/,/^# compose.yaml$/p' | sed '1d;$d' > Caddyfile
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Enforce immutable release contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          version=Path('VERSION').read_text().strip()
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          assert tuple(map(int,version.split('.'))) >= (0,4,1)
          for file in ('install.sh','bootstrap.sh','manager.py','release_verify.py','VERSION'):
              assert Path(file).is_file() and Path(file).stat().st_size > 0
          assert 'gh attestation verify' in Path('install.sh').read_text()
          assert 'release_verify.stage_revision' in Path('manager.py').read_text()
          PY
      - name: Publish keyless OIDC provenance for every executable release asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            install.sh
            bootstrap.sh
            manager.py
            release_verify.py
            VERSION
      - name: Verify exact attester workflow and main source revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in install.sh bootstrap.sh manager.py release_verify.py VERSION; do
            gh attestation verify "$file" --repo TriplexCorp/XMesh-Sub \
              --cert-identity "https://github.com/TriplexCorp/XMesh-Sub/.github/workflows/attested-release.yml@refs/heads/main" \
              --source-ref refs/heads/main --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done

      - name: Verify signed release in isolated CLI without anonymous API IP exhaustion
        # GitHub-hosted runners share the unauthenticated REST rate limit by
        # egress IP (60/hour). Only GET /attestations/sha256:... receives this
        # short-lived Actions token; downloaded artifacts and bundles remain
        # UNTRUSTED until the same offline signature, certificate identity,
        # main ref and exact SHA checks all pass.
        # This is NOT an anonymous-network clean-VPS acceptance test. That
        # separate deployment gate remains required before a production rollout.
        env:
          GH_CONFIG_DIR: ${{ runner.temp }}/isolated-release-gh
          XMESH_ATTESTATION_INDEX_TOKEN: ${{ github.token }}
        run: |
          unset GH_TOKEN GITHUB_TOKEN
          python3 - <<'PY'
          import os,tempfile
          from pathlib import Path
          import release_verify
          with tempfile.TemporaryDirectory() as temp:
              files=release_verify.stage_revision(
                  os.environ['GITHUB_SHA'], Path(temp),
                  attestations_read_token=os.environ['XMESH_ATTESTATION_INDEX_TOKEN'])
              assert set(files)==set(release_verify.FILES)
              print('Verified exact signed release: isolated CLI, offline OIDC proof, scoped API reads')
          PY

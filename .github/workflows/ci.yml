name: Sub gateway CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Syntax and ShellCheck
        run: |
          bash -n install.sh bootstrap.sh tests/test-install.sh tests/test-bootstrap.sh tests/test-runtime-edge.sh
          shellcheck -s bash install.sh bootstrap.sh tests/test-install.sh tests/test-bootstrap.sh tests/test-runtime-edge.sh
      - name: Installer argument tests
        run: |
          bash tests/test-install.sh
          bash tests/test-bootstrap.sh
      - name: Outbound signed agent and edge IP limiter tests
        run: |
          python3 -m py_compile manager.py limiter.py tests/test-image-rollback.py
          python3 tests/test-manager.py
          python3 tests/test-limiter.py
      - name: Validate rendered Caddy configuration
        run: |
          bash install.sh --panel https://panel.example.org --domain sub.example.org --path /s --dry-run | sed -n '/^# Caddyfile$/,/^# compose.yaml$/p' | sed '1d;$d' > Caddyfile
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.9-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Verify keyless release security policy and negative cases
        run: |
          python3 -m py_compile release_verify.py
          python3 tests/test-release-verify.py
          python3 tests/test-workflow-security.py
          grep -Fq 'gh attestation verify' install.sh
          grep -Fq 'stage_revision' manager.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          version = Path("VERSION").read_text().strip()
          assert re.fullmatch(r"\d+\.\d+\.\d+", version)
          assert tuple(map(int, version.split("."))) >= (0, 4, 3)
          PY
          ! grep -Fq 'release.json.sig' install.sh

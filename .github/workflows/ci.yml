name: Sub gateway CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and ShellCheck
        run: |
          bash -n install.sh tests/test-install.sh
          shellcheck -s bash install.sh tests/test-install.sh
      - name: Installer argument tests
        run: bash tests/test-install.sh
      - name: Outbound management agent tests
        run: |
          python3 -m py_compile manager.py flood_guard.py
          python3 tests/test-manager.py
          python3 tests/test-flood-guard.py
      - name: Validate rendered Caddy configuration
        run: |
          bash install.sh --panel https://panel.example.org --domain sub.example.org --path /s --dry-run | sed -n '/^# Caddyfile$/,/^# compose.yaml$/p' | sed '1d;$d' > Caddyfile
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate managed edge shield Caddy configuration
        run: |
          printf '%064d\n' 0 | bash install.sh --panel https://panel.example.org --domain sub.example.org --path /s --enroll-token-stdin --dry-run | sed -n '/^# Caddyfile$/,/^# compose.yaml$/p' | sed '1d;$d' > Caddyfile
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Verify offline-signed release and exact build digests
        run: |
          base64 -d release.json.sig > release.sig.bin
          openssl pkeyutl -verify -pubin -inkey release.pub -rawin -in release.json -sigfile release.sig.bin
          python3 - <<'PY'
          import hashlib,json,pathlib
          manifest=json.loads(pathlib.Path('release.json').read_text())
          assert manifest['schema']==1
          assert manifest['version']==pathlib.Path('VERSION').read_text().strip()
          for name,key in [('install.sh','installSha256'),('manager.py','managerSha256'),('flood_guard.py','floodGuardSha256')]:
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==manifest[key], name
          PY


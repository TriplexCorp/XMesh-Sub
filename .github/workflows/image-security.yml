name: Sub deployable image CVE gate
on:
  pull_request:
    paths:
      - 'install.sh'
      - 'tests/test-install.sh'
      - 'tests/test-runtime-edge.sh'
      - 'tests/test-image-rollback.py'
      - '.github/workflows/image-security.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/attested-release.yml'
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  image-cve-gate:
    name: image-cve-gate (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Fetch exact source without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify images rendered by signed installer
        shell: bash
        run: |
          set -Eeuo pipefail
          bash install.sh --panel https://panel.example.org --domain sub.example.org --path /s --dry-run > "$RUNNER_TEMP/sub-dry-run"
          sed -n '/^# compose.yaml$/,/^# limiter.py$/p' "$RUNNER_TEMP/sub-dry-run" | sed '1d;$d' > "$RUNNER_TEMP/compose.yaml"
          python3 - <<'PY'
          import os, pathlib, re
          compose=pathlib.Path(os.environ["RUNNER_TEMP"],"compose.yaml").read_text()
          refs=re.findall(r"^\s+image:\s+(\S+)\s*$",compose,re.M)
          allowed=("xmesh-sub-limiter:rev-0000000000000000000000000000000000000000","xmesh-sub-caddy:rev-0000000000000000000000000000000000000000")
          if len(refs)!=2 or set(refs)!=set(allowed):
              raise SystemExit(f"Unexpected installer runtime images: {refs}")
          pathlib.Path(os.environ["RUNNER_TEMP"],"image-refs.txt").write_text("\n".join(refs)+"\n")
          dockerfile=pathlib.Path(os.environ["RUNNER_TEMP"],"sub-dry-run").read_text().split("# Dockerfile.limiter\n",1)[1].split("\n# Dockerfile.caddy\n",1)[0]
          if "FROM python:3.12.16-alpine3.24@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89" not in dockerfile or "apk --no-cache upgrade krb5-libs" not in dockerfile:
              raise SystemExit("Signed installer did not render the pinned patched limiter Dockerfile")
          pathlib.Path(os.environ["RUNNER_TEMP"],"Dockerfile.limiter").write_text(dockerfile)
          caddyfile=pathlib.Path(os.environ["RUNNER_TEMP"],"sub-dry-run").read_text().split("# Dockerfile.caddy\n",1)[1].split("\n# Caddyfile\n",1)[0]
          if not all(item in caddyfile for item in ("FROM caddy:2.11.9-builder-alpine@sha256:646fee578e680989ca5c7fd1ce6f1de574d19fd71ef2221810cc0510a9f40c86", "xcaddy build v2.11.9", "github.com/smallstep/certificates@v0.30.3-0.20261105213751-6d5a251fbe01", "go.step.sm/crypto@v0.92.0", "golang.org/x/net@v0.62.0")):
              raise SystemExit("Signed installer did not render patched Caddy builder")
          pathlib.Path(os.environ["RUNNER_TEMP"],"Dockerfile.caddy").write_text(caddyfile)
          print("Verified both signed-installer image references")
          PY
      - name: Build both signed-installer runtime containers
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull --platform linux/${{ matrix.arch }} caddy:2.11.9-alpine
          docker pull --platform linux/${{ matrix.arch }} python:3.12.16-alpine3.24
          mkdir -p "$RUNNER_TEMP/limiter-build" "$RUNNER_TEMP/caddy-build"
          cp "$RUNNER_TEMP/Dockerfile.limiter" "$RUNNER_TEMP/limiter-build/Dockerfile"
          cp "$RUNNER_TEMP/Dockerfile.caddy" "$RUNNER_TEMP/caddy-build/Dockerfile"
          docker build --pull --platform linux/${{ matrix.arch }} --tag xmesh-sub-limiter:rev-0000000000000000000000000000000000000000 "$RUNNER_TEMP/limiter-build"
          docker build --pull --platform linux/${{ matrix.arch }} --tag xmesh-sub-caddy:rev-0000000000000000000000000000000000000000 "$RUNNER_TEMP/caddy-build"
          {
            docker image inspect --format '{{index .RepoDigests 0}}' caddy:2.11.9-alpine
            docker image inspect --format '{{index .RepoDigests 0}}' python:3.12.16-alpine3.24
            docker image inspect --format '{{.Id}}' xmesh-sub-limiter:rev-0000000000000000000000000000000000000000
            docker image inspect --format '{{.Id}}' xmesh-sub-caddy:rev-0000000000000000000000000000000000000000
          } | tee "$RUNNER_TEMP/image-digests.txt"
          docker run --rm -v "$RUNNER_TEMP/sub-dry-run:/tmp/ignore:ro" xmesh-sub-caddy:rev-0000000000000000000000000000000000000000 caddy version
          sed -n '/^# Caddyfile$/,/^# compose.yaml$/p' "$RUNNER_TEMP/sub-dry-run" | sed '1d;$d' > "$RUNNER_TEMP/Caddyfile"
          test -s "$RUNNER_TEMP/Caddyfile"
          docker run --rm -v "$RUNNER_TEMP/Caddyfile:/etc/caddy/Caddyfile:ro" xmesh-sub-caddy:rev-0000000000000000000000000000000000000000 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm xmesh-sub-caddy:rev-0000000000000000000000000000000000000000 caddy build-info > "$RUNNER_TEMP/caddy-build-info.txt"
          if grep -Fq 'github.com/go-jose/go-jose/v3' "$RUNNER_TEMP/caddy-build-info.txt"; then
            echo 'Unexpected vulnerable JOSE-v3 dependency in final Caddy build' >&2
            exit 1
          fi
          grep -Fq 'github.com/go-jose/go-jose/v4' "$RUNNER_TEMP/caddy-build-info.txt" || { echo 'Expected patched JOSE-v4 missing' >&2; exit 1; }
      - name: Exercise real Caddy and Unix limiter against spoofed client headers
        shell: bash
        run: |
          XMESH_SUB_CADDY_IMAGE=xmesh-sub-caddy:rev-0000000000000000000000000000000000000000 XMESH_SUB_LIMITER_IMAGE=xmesh-sub-limiter:rev-0000000000000000000000000000000000000000 \
            bash tests/test-runtime-edge.sh "$RUNNER_TEMP"
      - name: Recover exact old Docker image IDs after simulated broken upgrade
        shell: bash
        run: |
          XMESH_SUB_CADDY_IMAGE=xmesh-sub-caddy:rev-0000000000000000000000000000000000000000 XMESH_SUB_LIMITER_IMAGE=xmesh-sub-limiter:rev-0000000000000000000000000000000000000000 \
            python3 tests/test-image-rollback.py
      - name: Install pinned and checksum-verified Trivy v0.76.2
        env:
          TRIVY_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,io,os,pathlib,tarfile,urllib.request
          arch=os.environ.get("TRIVY_ARCH")
          signed_release_assets={
              "amd64":("Linux-64bit","bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"),
              "arm64":("Linux-ARM64","ab9d51f86e6a5fb936f605faff6b593ac51bc378fff4d3e8b9d58358b9c367c3"),
          }
          if arch not in signed_release_assets:
              raise SystemExit("Unsupported Trivy architecture")
          suffix,wanted=signed_release_assets[arch]
          url=f"https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_{suffix}.tar.gz"
          with urllib.request.urlopen(url,timeout=75) as request:
              data=request.read(100*1024*1024+1)
          actual=hashlib.sha256(data).hexdigest()
          if len(data)>100*1024*1024 or actual!=wanted:
              raise SystemExit(f"Trivy archive mismatch: size={len(data)}, actual_sha256={actual}, expected_sha256={wanted}. Refusing to execute.")
          with tarfile.open(fileobj=io.BytesIO(data),mode="r:gz") as tar:
              entry=tar.getmember("trivy")
              if not entry.isfile() or not 0 < entry.size <= 256*1024*1024:
                  raise SystemExit("Unexpected Trivy executable")
              extracted=tar.extractfile(entry)
              if extracted is None: raise SystemExit("Trivy binary missing")
              target=pathlib.Path(os.environ["RUNNER_TEMP"])/"trivy"
              data_bytes=extracted.read(256*1024*1024+1)
              if len(data_bytes)>256*1024*1024 or len(data_bytes)!=entry.size:
                  raise SystemExit("Unexpected Trivy executable extraction size")
              target.write_bytes(data_bytes)
              target.chmod(0o700)
          PY
      - name: Scan both exact deployable runtime images
        shell: bash
        run: |
          set -Eeuo pipefail
          "$RUNNER_TEMP/trivy" image --scanners vuln --format json \
            --output "$RUNNER_TEMP/caddy-vulnerabilities.json" --no-progress xmesh-sub-caddy:rev-0000000000000000000000000000000000000000
          "$RUNNER_TEMP/trivy" image --scanners vuln --format json \
            --output "$RUNNER_TEMP/limiter-vulnerabilities.json" --no-progress xmesh-sub-limiter:rev-0000000000000000000000000000000000000000
      - name: Preserve evidence including any unresolved advisories
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sub-runtime-image-security-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/caddy-vulnerabilities.json
            ${{ runner.temp }}/limiter-vulnerabilities.json
            ${{ runner.temp }}/image-digests.txt
            ${{ runner.temp }}/image-refs.txt
            ${{ runner.temp }}/Dockerfile.limiter
            ${{ runner.temp }}/Dockerfile.caddy
          if-no-files-found: warn
          retention-days: 14
      - name: Fail closed on unresolved High and Critical vulnerabilities
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import collections,json,os,pathlib
          folder=pathlib.Path(os.environ["RUNNER_TEMP"])
          count=0
          for file in ("caddy-vulnerabilities.json","limiter-vulnerabilities.json"):
              report=json.loads((folder/file).read_text())
              vulnerabilities=[v for target in report.get("Results",[]) for v in target.get("Vulnerabilities",[])]
              totals=collections.Counter(v.get("Severity","UNKNOWN") for v in vulnerabilities)
              print(f"{file}: {dict(totals)}")
              high=[v for v in vulnerabilities if v.get("Severity") in ("HIGH","CRITICAL")]
              count+=len(high)
              for v in high:
                  print("UNRESOLVED",file,v.get("VulnerabilityID"),v.get("PkgName"),
                        "installed="+str(v.get("InstalledVersion")),
                        "fixed="+str(v.get("FixedVersion") or "UNAVAILABLE"))
          if count:
              raise SystemExit(f"{count} High/Critical issues remain in Sub runtime images")
          print("Verified: no High/Critical advisories in scanned exact-runtime-image digests")
          PY
